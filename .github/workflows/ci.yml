name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly signal: typecheck + integration against the latest published
    # pi host. Only the nightly-latest job runs on this trigger.
    - cron: "0 3 * * *"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Host package check (manifest)
        # Blocks regressions of issue #7: host-provided packages must stay in
        # peerDependencies "*" and must not be installed locally.
        run: ./scripts/check-pi-version.sh

      - name: Lint (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint src/ test/
          else
            echo "No ESLint config, skipping"
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=verbose

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/config.js
          test -f dist/config.d.ts

      - name: Check package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"

  integration:
    name: Integration Test (Pi + Mock OpenAI)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install Pi CLI
        run: |
          # Read the tested host version from devDependencies (single source of
          # truth) rather than hardcoding it — a second hardcoded pin is what let
          # CI stay green on an old host version (issue #7).
          PI_VERSION=$(node -p "require('./package.json').devDependencies['@earendil-works/pi-coding-agent'].replace(/^[^\d]*/, '')")
          echo "Installing pi-coding-agent@${PI_VERSION} (from devDependencies)"
          npm install -g "@earendil-works/pi-coding-agent@${PI_VERSION}"

      - name: Run integration tests
        run: |
          chmod +x scripts/integration-test.sh
          ./scripts/integration-test.sh

  drift:
    name: Host version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Report pi version drift
        # Fails if devDependencies is behind the latest published host version.
        # This ensures dependabot PRs are merged promptly and the tested host
        # version stays current.
        run: ./scripts/check-pi-version.sh --strict

  nightly-latest:
    name: Nightly Check Against Latest pi
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install latest pi-coding-agent
        # dist-tags.latest excludes rc/beta/next prereleases.
        run: |
          LATEST=$(npm view @earendil-works/pi-coding-agent version)
          echo "Latest published pi-coding-agent: ${LATEST}"
          npm install -g "@earendil-works/pi-coding-agent@${LATEST}"

      - name: Run integration tests
        run: |
          chmod +x scripts/integration-test.sh
          ./scripts/integration-test.sh