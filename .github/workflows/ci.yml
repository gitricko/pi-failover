name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Lint (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint src/ test/
          else
            echo "No ESLint config, skipping"
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=verbose

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/config.js
          test -f dist/config.d.ts

      - name: Check package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"

  integration:
    name: Integration Test (Pi + Mock OpenAI)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      # Use a consistent HOME for Pi installation and test execution
      PITEST_HOME: ${{ runner.temp }}/pi-test-home
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Prepare test home directory
        run: |
          mkdir -p "$PITEST_HOME/.pi/agent"

      - name: Install Pi CLI
        run: |
          # Install Pi CLI from npm
          npm install -g @earendil-works/pi-coding-agent@0.84.2

      - name: Install extension locally
        run: |
          HOME="$PITEST_HOME" pi install . --local --approve

      - name: Run integration tests
        run: |
          chmod +x scripts/integration-test.sh
          HOME="$PITEST_HOME" ./scripts/integration-test.sh