name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Lint (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint src/ test/
          else
            echo "No ESLint config, skipping"
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run --reporter=verbose

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/config.js
          test -f dist/config.d.ts

      - name: Check package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"

  # Optional: Integration test with Pi CLI (requires Pi installation)
  integration:
    name: Integration Test (Optional)
    runs-on: ubuntu-latest
    if: false  # Set to true when Pi CLI is available in CI
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Pi CLI
        run: |
          # Install Pi CLI - this would need to be adapted based on Pi's installation method
          npm install -g @earendil-works/pi-coding-agent@0.84.2

      - name: Install extension locally
        run: |
          pi install . --local --approve

      - name: Verify extension loads
        run: |
          # This would run a quick Pi session to verify the extension loads
          echo "Integration test placeholder - requires Pi environment"